<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>劇団ツインリーブス 公演予約｜さくらプラザ・ホール 指定席予約</title>
    <meta
      name="description"
      content="劇団ツインリーブス オリジナルミュージカル『おとぎ話管理局』（2027年5月・さくらプラザ・ホール）の公演案内と指定席予約。あらすじ・公演情報・よくある質問のご案内に加え、座席表からゾーンを選んでお申し込みいただけます。当日は受付でお支払いいただきます。"
    />
    <meta name="theme-color" content="#b3273d" />
    <!-- 共有プレビュー（OGP）: 画像は本番オリジンの固定パス（public/og-image.jpg） -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="劇団ツインリーブス 公演予約" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:title" content="劇団ツインリーブス 公演予約｜さくらプラザ・ホール 指定席予約" />
    <meta
      property="og:description"
      content="劇団ツインリーブス オリジナルミュージカル『おとぎ話管理局』の公演案内と指定席予約。座席表からゾーンを選んでお申し込みいただけます。"
    />
    <meta property="og:url" content="https://sakura-seats.pages.dev/" />
    <meta property="og:image" content="https://sakura-seats.pages.dev/og-image.jpg" />
    <meta property="og:image:alt" content="劇団ツインリーブス公演のメインポスター" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="劇団ツインリーブス 公演予約｜さくらプラザ・ホール 指定席予約" />
    <meta
      name="twitter:description"
      content="劇団ツインリーブスの公演を、スマートフォンから指定席でご予約いただけます。座席表からゾーンを選んでお申し込みください。"
    />
    <meta name="twitter:image" content="https://sakura-seats.pages.dev/og-image.jpg" />
    <!-- アイコンとマニフェスト（パスはビルドの base に追随させる） -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <!-- 書体（R29で復帰）: 本文は M PLUS Rounded 1c を先頭に、読み込めない環境では
         端末ゴシックのスタックへ落ちる。見出しの明朝は端末フォントのみ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- R37: JS バンドル到達前の初期表示専用スタイル（外部 CSS がまだ
         読めていない段階でも崩れないよう、この文書内に閉じて書く。
         アプリ本体のスタイルとは共有しない） -->
    <style>
      .boot-shell {
        max-width: 880px;
        margin: 0 auto;
        padding: 64px 16px;
        text-align: center;
        font-family: sans-serif;
        color: #571122;
      }
      .boot-shell .boot-title {
        font-size: 20px;
        font-weight: 800;
        margin: 0 0 10px;
      }
      .boot-shell .boot-note {
        font-size: 14px;
        margin: 0;
        opacity: 0.75;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- R37: 初期ローディング表示。低速回線では JS 到達まで数秒かかる
           ため、その間も「開いている」ことが分かるようアプリ名と
           読み込み中表示を先に出す。React がマウントした時点で
           この中身は実画面に置き換わる。アプリ内のデータ読み込み用
           スケルトン（App.tsx）とは別レイヤー -->
      <div class="boot-shell" role="status">
        <p class="boot-title">劇団ツインリーブス 公演予約</p>
        <p class="boot-note">読み込み中…♪</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
